[project]
name = "shelf"
version = "0.1.0"
description = "A small reading list served on the web."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

# A build backend makes `uv run python -m shelf` find src/shelf (uv installs the project in place).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
